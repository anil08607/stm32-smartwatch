name: Hardware source and artifact integrity
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Verify committed native evidence and qualification status
        run: |
          python3 scripts/check-netlist.py
          bun scripts/check-evidence.mjs
      - name: Preserve generated circuit when verification fails
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: source-diagnostics
          path: routing/source.circuit.json
          retention-days: 1
